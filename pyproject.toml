[project]
name = "ing-datos-parser"
version = "0.2.0"
description = "ETL idempotente de reseteos de ADManager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["filelock>=3.16,<4"]

[project.scripts]
etl = "etl.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
